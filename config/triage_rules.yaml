# AgentSOC — Triage Agent policy (loaded by backend/app/agents/triage/config.py).
#
# The LLM proposes a TriageDecision; these deterministic rules decide whether it may be
# accepted. A decision that breaks a rule is rejected (one repair attempt), never "fixed".

context:
  # Bounds on what is sent to the model (only this incident's data is ever sent).
  max_events: 25
  max_resources: 6
  max_string_length: 240
  max_context_chars: 12000

policy:
  # Closing an incident needs high confidence and cannot happen at/above this severity.
  min_confidence_to_close: 0.8
  close_forbidden_at_or_above: high
  # P1 is reserved for serious incidents; critical incidents cannot be low priority.
  p1_requires_severity_at_least: high
  critical_requires_priority_at_most: P2
  # How many times a rejected model answer may be sent back for one repair.
  max_repair_attempts: 1

# rule_based_fallback: used ONLY when the caller explicitly asks for it and the LLM is
# unavailable/unusable. Its result is labelled method=rule_based_fallback everywhere.
fallback:
  confidence: 0.5
  investigate_at_or_above: medium
  escalate_to_critical_when:     # a high-severity incident becomes critical if it also has
    - privileged_principal       # one of these Monitor indicators
  priority_by_severity:
    critical: P1
    high: P2
    medium: P3
    low: P4
    info: P4
